<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — Buddy Patches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-content">
    <div id="admin-topbar"></div>
    <main class="admin-main">
      <div class="admin-page-head">
        <div>
          <h1>Dashboard</h1>
          <p class="admin-page-sub">A quick operational snapshot.</p>
        </div>
      </div>

      <!-- Operational queues: what needs the Owner's action right now.
           Each card is a link straight into the correctly filtered Orders
           view. Rendered by dashboard.js. -->
      <div class="admin-section-head">
        <h2>Needs your action</h2>
      </div>
      <div class="admin-queue-grid" data-operational-queues>
        <div class="admin-queue-card is-clear">
          <div class="admin-queue-card__count">&mdash;</div>
          <div class="admin-queue-card__body"><div class="admin-queue-card__title">Loading…</div></div>
        </div>
      </div>

      <div class="admin-section-head">
        <h2>At a glance</h2>
      </div>
      <div class="admin-kpi-grid">
        <div class="admin-kpi">
          <div class="admin-kpi__top">
            <span class="admin-kpi__label">Total orders</span>
          </div>
          <div class="admin-kpi__value is-loading" data-count-total-orders>&mdash;</div>
        </div>
        <div class="admin-kpi">
          <div class="admin-kpi__top">
            <span class="admin-kpi__label">Active products</span>
          </div>
          <div class="admin-kpi__value is-loading" data-count-products>&mdash;</div>
          <div class="admin-kpi__sub" data-count-products-sub></div>
        </div>
        <div class="admin-kpi">
          <div class="admin-kpi__top">
            <span class="admin-kpi__label">Patches</span>
          </div>
          <div class="admin-kpi__value is-loading" data-count-patches>&mdash;</div>
        </div>
        <div class="admin-kpi">
          <div class="admin-kpi__top">
            <span class="admin-kpi__label">Collections</span>
          </div>
          <div class="admin-kpi__value is-loading" data-count-collections>&mdash;</div>
        </div>
        <div class="admin-kpi">
          <div class="admin-kpi__top">
            <span class="admin-kpi__label">Out-of-stock products</span>
          </div>
          <div class="admin-kpi__value is-loading" data-count-lowstock>&mdash;</div>
        </div>
      </div>

      <div class="admin-section-head">
        <h2>Recent orders</h2>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Order #</th><th>Customer</th><th>Destination</th><th>Total</th><th>Payment</th><th>Fulfillment</th><th>Date</th><th></th></tr>
          </thead>
          <tbody data-recent-orders>
            <tr><td colspan="8" class="admin-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="admin-section-head">
        <h2>Inventory attention</h2>
      </div>
      <div class="admin-card" data-attention-card>
        <p class="admin-loading-line"><span class="admin-btn__spinner"></span> Loading…</p>
      </div>
    </main>
  </div>
</div>

<script type="module" src="./js/dashboard.js"></script>
</body>
</html>
