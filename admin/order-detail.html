<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Detail — Buddy Patches Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-content">
    <div id="admin-topbar"></div>
    <main class="admin-main">
      <div class="admin-page-head">
        <h1>Order <span data-order-number>&mdash;</span></h1>
        <a class="admin-btn admin-btn--ghost" href="orders.html">&larr; Back to orders</a>
      </div>

      <p class="admin-loading-line" data-order-loading><span class="admin-btn__spinner"></span> Loading order…</p>

      <div data-order-detail hidden>
        <div class="admin-card">
          <div style="display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;">
            <span data-order-date class="admin-row-sub"></span>
            <span class="admin-badge" data-payment-status-badge>&mdash;</span>
            <span class="admin-badge" data-fulfillment-status-badge>&mdash;</span>
            <span class="admin-badge" data-inventory-status-badge>&mdash;</span>
          </div>
        </div>

        <div class="admin-form-grid two-col">
          <div class="admin-card">
            <h2 class="admin-card__title">Customer</h2>
            <p data-customer-name style="font-weight:700;margin:0 0 2px;"></p>
            <p data-customer-email class="admin-row-sub" style="margin:0 0 2px;"></p>
            <p data-customer-mobile class="admin-row-sub" style="margin:0;"></p>
            <p data-order-notes class="hint" style="margin-top:10px;"></p>
          </div>
          <div class="admin-card">
            <h2 class="admin-card__title">Delivery</h2>
            <p data-delivery-method style="font-weight:700;margin:0 0 6px;"></p>
            <div data-delivery-address class="admin-row-sub"></div>
          </div>
        </div>

        <!-- ============ PAYMENT REVIEW (primary operational section) ============ -->
        <div class="admin-card admin-op-card" data-payment-card>
          <div data-payment-banner></div>
          <h2 class="admin-card__title">Payment</h2>
          <p class="admin-card__desc">What this customer owes, what they say they sent, and your decision.</p>
          <div data-payment-expected></div>
          <div data-payment-current></div>
          <div data-payment-actions></div>
          <hr class="admin-divider" />
          <h3 class="admin-card__title" style="font-size:15px;">Payment attempt history</h3>
          <div data-payment-attempts></div>
        </div>

        <!-- ============ FULFILLMENT (primary operational section) ============ -->
        <div class="admin-card admin-op-card" data-fulfillment-card>
          <div data-fulfillment-banner></div>
          <h2 class="admin-card__title">Fulfillment</h2>
          <p class="admin-card__desc" data-fulfillment-desc></p>
          <div data-fulfillment-steps></div>
          <div data-shipment-details></div>
          <div data-fulfillment-actions></div>
        </div>

        <div class="admin-card">
          <h2 class="admin-card__title">Order items</h2>
          <div data-detail-lines class="order-lines"></div>
          <hr class="admin-divider" />
          <div class="order-totals">
            <div class="checkout-summary__row"><span>Subtotal</span><span data-detail-subtotal>&mdash;</span></div>
            <div class="checkout-summary__row"><span data-detail-shipping-label>Shipping</span><span data-detail-shipping>&mdash;</span></div>
            <div class="checkout-summary__row checkout-summary__row--total"><span>Grand Total</span><span data-detail-total>&mdash;</span></div>
          </div>
        </div>

        <div class="admin-card">
          <h2 class="admin-card__title">Audit history</h2>
          <div data-order-history></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/order-preview.js"></script>
<script type="module" src="./js/order-detail.js"></script>
</body>
</html>
